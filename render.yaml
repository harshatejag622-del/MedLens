services:
  # 1. MedLens Backend (FastAPI Python)
  - type: web
    name: medlens-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./medlens.db
      - key: STORAGE_DIR
        value: ./storage/documents
      - key: AI_PROVIDER
        value: local

  # 2. MedLens Frontend (React / Vite Static Site)
  - type: static
    name: medlens-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
