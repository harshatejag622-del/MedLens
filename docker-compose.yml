version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./medlens.db
      - AI_PROVIDER=local
      - DEMO_MODE=true
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/medlens.db:/app/medlens.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
